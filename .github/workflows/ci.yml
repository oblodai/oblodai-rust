name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oblodai/oblodai-backend
          path: oblodai-backend
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - name: Every gate
        run: make ci
        env:
          OBLODAI_BACKEND: ${{ github.workspace }}/oblodai-backend
          GOTOOLCHAIN: local
