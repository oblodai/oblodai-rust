# Publishes the 'oblodai' crate to crates.io on a v* tag.
# Required repo secret: CARGO_REGISTRY_TOKEN (crates.io API token).
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: actions/checkout@v4
        with:
          repository: oblodai/oblodai-backend
          path: oblodai-backend
      # A missing token must stop the release loudly, before anything is built or published.
      - name: The publishing token is present
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" \
            || { echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io"; exit 1; }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # The same gates CI runs, on the exact commit being published.
      - name: Formatting
        run: cargo fmt --all --check
      - name: Generated code drift
        run: ./scripts/check_generated.sh --require
        env:
          OBLODAI_BACKEND: ${{ github.workspace }}/oblodai-backend
          GOTOOLCHAIN: local
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-features
      - run: cargo publish --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Transfer ownership to the org team so the personal account isn't the public owner.
      # Best-effort: a hiccup here must not fail an already-successful publish.
      - name: Set crate owner to org team
        run: |
          sleep 15
          cargo owner --add github:oblodai:owners oblodai || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
