# Publishes the 'oblodai' crate to crates.io on a v* tag.
# Required repo secret: CARGO_REGISTRY_TOKEN (crates.io API token).
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # A missing token must stop the release loudly, before anything is built or published.
      - name: The publishing token is present
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" \
            || { echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io"; exit 1; }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # The same gates CI runs, on the exact commit being published. No backend code runs here (the
      # backend repository is private and this job holds the publishing token): the drift check is
      # part of `make ci` locally, the conformance suite runs against the vendored contract/.
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
        env:
          SDKGEN_CONFORMANCE: ${{ github.workspace }}/contract/tools/sdkgen/conformance
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # Transfer ownership to the org team so the personal account isn't the public owner.
      # Best-effort: a hiccup here must not fail an already-successful publish.
      - name: Set crate owner to org team
        run: |
          sleep 15
          cargo owner --add github:oblodai:owners oblodai || true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
